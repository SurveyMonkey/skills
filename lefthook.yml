# lefthook.yml: local git hooks, staged-only and fast (ADR 005, amended by
# #249). Installed by `pnpm install` (lefthook's own postinstall runs
# `lefthook install`, via `pnpm.onlyBuiltDependencies` in package.json,
# since pnpm 10 blocks a dependency's lifecycle scripts otherwise) or by
# hand with `pnpm exec lefthook install`.
#
# pre-commit runs only the gates that are cheap: ShellCheck over staged shell
# files, `tsc -p` when TypeScript or its configuration is staged, Biome over
# the staged JSON, .mjs and .ts, and `claude plugin validate --strict` when a
# manifest is staged. None of them runs a suite. #219 adds its own step here
# as its toolchain lands.
#
# pre-push runs nothing. CI is the enforcement boundary (ADR 005): the
# shellspec and vitest suites need tooling a fresh clone may not have
# (shellspec, an installed node_modules), and a slow pre-push hook trains
# people straight to --no-verify. This replaces .githooks/pre-push, which
# ran both suites there; #249 removes that step rather than porting it.
#
# Bypass for one commit or push with --no-verify. CI enforces regardless.

pre-commit:
  commands:
    # Glob matches check.sh's own shell_targets discovery (scripts/check.sh,
    # `git ls-files -- '*.sh'`), so a file this step skips is never one the
    # lint gate would have covered, and vice versa.
    shellcheck:
      glob: '*.sh'
      run: |
        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck {staged_files}
        else
          printf '\n!! pre-commit: shellcheck is not installed, so the lint gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   brew install shellcheck\n\n' >&2
        fi
    # The one step that is NOT staged-only: `tsc -p tsconfig.json` checks the
    # whole project (#214, ADR 012), because a type error caused by a staged
    # file is usually in a file that was not staged, and a project-wide
    # checker handed a file list answers a different question. The glob
    # decides when the step runs, not what it checks. It stays sub-second and
    # runs no suite, so the rule this file exists for (ADR 005 as amended by
    # #249) holds. `*.ts` here matches a nested staged file too (e.g.
    # plugins/gh-security/src/lib/node-floor.ts), the same way the
    # shellcheck step's `*.sh` above does.
    types:
      glob: '{*.ts,tsconfig.json}'
      run: |
        if [ -d node_modules ]; then
          ./scripts/check.sh types
        else
          printf '\n!! pre-commit: node_modules is absent, so the types gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   pnpm install\n\n' >&2
        fi
    # Biome over the staged files only (#250). `--staged` is Biome's own
    # selection rather than a file list from lefthook: it reads the index the
    # way the CI run reads the tree, and it applies biome.json's exclusions
    # itself, so a staged specimen under spec/fixtures/ is skipped here
    # exactly as it is there. --no-errors-on-unmatched is what makes that
    # skip a pass rather than "no files were processed", which Biome treats
    # as an error. `check`, never `check --write`: a hook that edits the tree
    # commits something nobody reviewed.
    biome:
      glob: '*.{json,mjs,ts}'
      run: |
        if [ -d node_modules ]; then
          pnpm exec biome check --staged --error-on-warnings --no-errors-on-unmatched
        else
          printf '\n!! pre-commit: node_modules is absent, so the biome gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   pnpm install\n\n' >&2
        fi
    plugin-validate:
      glob: '{.claude-plugin/**,plugins/*/.claude-plugin/**}'
      run: |
        if command -v claude >/dev/null 2>&1; then
          ./scripts/check.sh validate
        else
          printf '\n!! pre-commit: claude (the Claude Code CLI) is not installed, so the validate gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   curl -fsSL https://claude.ai/install.sh | bash\n\n' >&2
        fi

pre-push:
  # Deliberately empty. See the file header: no suite runs on push, CI
  # enforces both, and a hook that pays for a suite trains people to
  # --no-verify. This is the whole reason #249 exists over keeping
  # .githooks/pre-push, which paid that cost locally.
  commands: {}
