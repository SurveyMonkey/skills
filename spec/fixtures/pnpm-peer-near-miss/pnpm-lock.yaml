# Regenerated from a real `pnpm install --lockfile-only` run (pnpm 10.33.2,
# lockfileVersion 9.0) and trimmed to the principal entries. The near-miss
# for issue #103's peer_only rule: `vite` is peer-instantiated by
# `@vitejs/plugin-react` (suffixed key, suffixed edge) AND an ordinary
# dependency of `vite-node`, whose key carries no `(vite@`. That one
# non-suffixed edge is a declaration an override can reach, so peer_only is
# false and both parents are reported.
