# A codeload copy of `debug` beside two registry copies of it (#313). This file is
# the lockfile of a real `pnpm install --lockfile-only` run (pnpm 10.34.5,
# lockfileVersion 9.0) on `debug` from `github:<owner>/debug#4.3.4`, the alias
# `debug-latest` of `debug` 4.4.3, and `finalhandler` 1.1.2, which resolves
# `debug` 2.6.9. The one edit: the GitHub owner and name are now `example/debug`.
#
# The `packages:` entry of the codeload copy gives its manifest version,
# `version: 4.3.4`. A scoped override of `ms` under `debug` qualifies that copy
# by it (`debug@4.3.4>ms`).
